name: hostelcc
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hostelcc
      POSTGRES_USER: hostelcc
      POSTGRES_PASSWORD: ${HOSTELCC_DB_PASSWORD:?Set HOSTELCC_DB_PASSWORD}
    command: [postgres, -c, shared_buffers=48MB, -c, max_connections=25, -c, work_mem=2MB]
    volumes:
      - fresh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hostelcc -d hostelcc']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 192m
    logging: *logging
    restart: unless-stopped
  server:
    image: ${SERVER_IMAGE:-hostelcc-server:local}
    build: ./hostelCC-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/hostelcc
      DB_USER: hostelcc
      DB_PASSWORD: ${HOSTELCC_DB_PASSWORD}
      DB_POOL_SIZE: 5
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECURE: 'true'
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-hostelcc@localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      OTP_IP_LIMIT: ${OTP_IP_LIMIT:-300}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=32m -Xss512k
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/api/health']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    mem_limit: 384m
    read_only: true
    tmpfs: [/tmp:size=32m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:-hostelcc-web:local}
    build: ./HostelCC-web
    ports:
      - '127.0.0.1:${SITE_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 48m
    read_only: true
    tmpfs: [/var/cache/nginx:size=16m, /var/run:size=1m, /tmp:size=8m]
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped
volumes:
  fresh_postgres_data:
