{% extends 'base.html' %}
{% block content %}
<style>
  .change-password-tabs {
    max-width: 460px;
    margin-inline: auto;
  }
</style>
<div class="tabs change-password-tabs">
  <section class="tab">
    <h2>Change Password</h2>
    <p class="muted">OTP verification is required before updating your password.</p>

    {% if error_message %}
    <div class="error">{{ error_message }}</div>
    {% endif %}

    <form method="post" autocomplete="off">
      {% csrf_token %}
      <label for="otp_code">One-Time Password (OTP)</label>
      <input id="otp_code" name="otp_code" type="text" maxlength="6" required placeholder="Enter 6-digit OTP" />
      {% if fixed_otp %}
      <p class="hint">Dev OTP: {{ fixed_otp }}</p>
      {% endif %}

      <label for="new_password">New Password</label>
      <input id="new_password" name="new_password" type="password" minlength="8" required placeholder="At least 8 characters" />
      <button type="submit">Update Password</button>
    </form>
  </section>
</div>
{% endblock %}
