{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}HostelCC Admin{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">HostelCC Admin</a></h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  html,
  body {
    min-height: 100%;
  }

  body {
    display: flex;
    justify-content: center;
    background: linear-gradient(135deg, #f5f8ff 0%, #fafafa 100%);
  }

  #container {
    width: min(96vw, 1760px);
    margin: 16px auto !important;
  }

  #header,
  #content,
  #content-main,
  .dashboard #content,
  .dashboard #content-main {
    width: 100% !important;
    max-width: 100% !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  #content {
    display: grid;
    justify-items: center;
    align-items: start;
    padding: 18px !important;
  }

  #content-main {
    border: 1px solid #dcdcdc;
    border-radius: 12px;
    background: #ffffff;
    padding: 16px;
  }

  .module,
  .inline-group,
  .results,
  #changelist {
    width: 100%;
  }

  #changelist .paginator,
  .submit-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  /* Fallback form styling in admin even if external static CSS fails. */
  #content-main input[type="text"],
  #content-main input[type="email"],
  #content-main input[type="password"],
  #content-main input[type="number"],
  #content-main input[type="search"],
  #content-main input[type="url"],
  #content-main input[type="tel"],
  #content-main input[type="date"],
  #content-main input[type="time"],
  #content-main input[type="datetime-local"],
  #content-main input:not([type]),
  #content-main select,
  #content-main textarea {
    border: 1px solid #c8c8c8 !important;
    border-radius: 8px !important;
    padding: 10px 12px !important;
    min-height: 40px;
    background: #ffffff !important;
    color: #1a1a1a !important;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }

  #content-main input:focus,
  #content-main select:focus,
  #content-main textarea:focus {
    outline: none;
    border-color: #0078d4 !important;
    box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.15) !important;
  }

  #content-main label,
  .aligned label {
    font-weight: 700;
  }

  @media (max-width: 980px) {
    #container {
      width: 100vw;
      margin: 0 !important;
    }

    #content {
      padding: 10px !important;
    }
  }
</style>
{% endblock %}
