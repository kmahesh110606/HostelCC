services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hostel_db
      POSTGRES_USER: hostel_user
      POSTGRES_PASSWORD: hostel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    depends_on:
      - postgres
    environment:
      AUTH_TYPE: scram-sha-256
      DB_USER: hostel_user
      DB_PASSWORD: hostel_password
      DB_HOST: postgres
      DB_NAME: hostel_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn hostel_app.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    depends_on:
      - pgbouncer
      - redis
    volumes:
      - ./:/app
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/app/media:ro
      - ./staticfiles:/app/staticfiles:ro
    ports:
      - "8080:80"

volumes:
  postgres_data:
