<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Management</title>
  <style>
    :root {
      --bg: #eef3fb;
      --panel: #ffffff;
      --text: #142235;
      --accent: #124ea6;
      --accent-dark: #0d3a7c;
      --warn: #f08c00;
      --ok: #237a4c;
      --line: #cfdaea;
      --muted: #4f6280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .navbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shell {
      max-width: 1100px;
      margin: 18px auto;
      padding: 0 16px;
    }
    .tabs {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .tab {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      min-height: 120px;
      box-shadow: 0 2px 10px rgba(17, 38, 68, 0.04);
    }
    .label {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: #e8f0fc;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 600;
    }
    h1, h2, p { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 14px; }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .messages {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .messages li {
      border: 1px solid var(--line);
      background: #f7faff;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
    }

    .auth-wrap {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }

    .auth-panel {
      width: 100%;
      max-width: 520px;
      padding: 4px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #294566;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      border: 1px solid #b9c9de;
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 15px;
      color: var(--text);
      background: #ffffff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(18, 78, 166, 0.14);
    }

    button,
    .button {
      display: inline-block;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      color: #ffffff;
      background: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }

    button:hover,
    .button:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .button.secondary {
      color: var(--text);
      background: #ffffff;
      border-color: var(--line);
    }

    .button.secondary:hover {
      background: #f5f8ff;
      border-color: #b9c9de;
    }

    .error {
      background: #fff4f4;
      color: #8c2f2f;
      border: 1px solid #f2c1c1;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: -6px;
      margin-bottom: 12px;
    }

    .linklike {
      margin-left: 8px;
      color: var(--accent);
      background: transparent;
      border: 0;
      padding-left: 0;
      padding-right: 0;
    }

    .linklike:hover {
      color: var(--accent-dark);
      background: transparent;
      border: 0;
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .nav-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="nav-inner">
      <div>
        <h1>Hostel Management System</h1>
        <p class="muted">Role dashboard with secure API-backed modules</p>
      </div>
      {% if user.is_authenticated %}
      <div class="row">
        <a class="button secondary" href="/profile/">Profile</a>
        <a class="button secondary" href="/community/">Community</a>
        <span class="label">{{ user.role }}</span>
        <a class="button" href="/accounts/logout/">Logout</a>
      </div>
      {% endif %}
    </div>
  </div>
  <div class="shell">
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li>{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
