name: Deploy HostelCC to EC2
on:
  workflow_run:
    workflows: [Verify HostelCC]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hostelcc-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      REVISION: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      API_URL: ${{ vars.PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Validate deployment settings
        shell: bash
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]
          [[ "$INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]
          [[ "$DEPLOY_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$API_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?/api$ ]]
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$REVISION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: hostelCC-server/pom.xml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          cache: true
      - name: Build signed Android APK
        working-directory: hostelCC-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hostelcc.jks"
          # Java properties quoting, without printing signing credentials.
          python3 - <<'PY'
          import os
          from pathlib import Path
          def escape(v):
              return v.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace(" ", "\\ ")
          values = {"storeFile": os.environ["RUNNER_TEMP"] + "/hostelcc.jks", "storePassword": os.environ["STORE_PASSWORD"], "keyPassword": os.environ["KEY_PASSWORD"], "keyAlias": os.environ["KEY_ALIAS"]}
          Path("android/key.properties").write_text("".join(k+"="+escape(v)+"\n" for k,v in values.items()))
          PY
          flutter pub get
          flutter build apk --release "--dart-define=API_BASE_URL=$API_URL"
          mkdir -p ../HostelCC-web/public/downloads
          cp build/app/outputs/flutter-apk/app-release.apk ../HostelCC-web/public/downloads/HostelCC.apk
      - run: chmod +x mvnw && ./mvnw -B package -DskipTests
        working-directory: hostelCC-server
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and publish immutable images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if ! aws ecr describe-images --repository-name hostelcc-server --image-ids "imageTag=$REVISION" >/dev/null 2>&1; then
            docker build -f hostelCC-server/Dockerfile.prebuilt -t "$REGISTRY/hostelcc-server:$REVISION" hostelCC-server
            docker push "$REGISTRY/hostelcc-server:$REVISION"
          fi
          if ! aws ecr describe-images --repository-name hostelcc-web --image-ids "imageTag=$REVISION" >/dev/null 2>&1; then
            docker build -t "$REGISTRY/hostelcc-web:$REVISION" HostelCC-web
            docker push "$REGISTRY/hostelcc-web:$REVISION"
          fi
          tar -czf deployment.tgz docker-compose.yml docker-compose.production.yml docker-compose.backup.yml deploy
          aws s3 cp deployment.tgz "s3://$DEPLOY_BUCKET/releases/$REVISION/deployment.tgz" --only-show-errors
      - name: Deploy through Systems Manager
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$REVISION"
          command="set -eu; mkdir -p /opt/hostelcc/releases/$REVISION; aws s3 cp s3://$DEPLOY_BUCKET/releases/$REVISION/deployment.tgz /opt/hostelcc/releases/$REVISION/deployment.tgz --region $AWS_REGION --only-show-errors; tar -xzf /opt/hostelcc/releases/$REVISION/deployment.tgz -C /opt/hostelcc/releases/$REVISION; bash /opt/hostelcc/releases/$REVISION/deploy/ec2-deploy.sh $REVISION $REGISTRY $AWS_REGION"
          jq -n --arg command "$command" '{commands:[$command],executionTimeout:["600"]}' > parameters.json
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://parameters.json --query Command.CommandId --output text)
          for attempt in $(seq 1 80); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            echo "SSM poll $attempt: ${status:-pending}"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query '{status:Status,output:StandardOutputContent,error:StandardErrorContent}'
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment did not finish within the polling window; inspect SSM command $id."
          exit 1
      - name: Verify public HTTPS and APK
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$API_URL/health"
          curl --fail --silent --show-error --range 0-3 "${API_URL%/api}/downloads/HostelCC.apk" -o /dev/null
      - if: always()
        name: Remove temporary signing material
        run: rm -f "$RUNNER_TEMP/hostelcc.jks" hostelCC-app/android/key.properties
