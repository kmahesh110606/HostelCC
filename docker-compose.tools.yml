services:
  database-tools:
    image: adminer:5
    profiles: [database-tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '127.0.0.1:${DATABASE_TOOLS_PORT:-8081}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 96m
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
