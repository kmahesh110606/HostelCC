services:
  backup:
    image: postgres:17-alpine
    entrypoint: [/bin/sh, /opt/backup.sh]
    environment:
      PGHOST: postgres
      PGUSER: hostelcc
      PGDATABASE: hostelcc
      PGPASSWORD: ${HOSTELCC_DB_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/opt/backup.sh:ro
      - ${BACKUP_DIRECTORY:-./backups}:/backups
    depends_on:
      server:
        condition: service_healthy
    mem_limit: 96m
    healthcheck:
      test: [CMD-SHELL, 'test -f /backups/last-success && find /backups/last-success -mmin -$$((BACKUP_INTERVAL_SECONDS / 60 + 10)) | grep -q last-success']
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 2
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
    restart: unless-stopped
